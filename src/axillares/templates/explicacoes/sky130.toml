# O que é cada camada e cada família de célula do sky130, para o inspetor do layout.

[camadas]
"prBoundary.boundary" = "Contorno de cada célula padrão: o retângulo que ela ocupa na linha."
"li1.drawing" = "Local interconnect: uma camada de ligação local, logo acima dos transistores. Liga as partes de dentro de cada célula e forma os pinos dela."
"li1.pin" = "Pinos das células na camada li1: onde os fios do roteamento se conectam."
"li1.label" = "Nomes dos pinos na camada li1."
"mcon.drawing" = "Contatos entre li1 e met1."
"met1.drawing" = "Metal 1, a camada de fio mais baixa. Leva os trilhos de alimentação de cada linha de células e fios curtos."
"met1.pin" = "Pinos em metal 1."
"met1.label" = "Nomes em metal 1."
"via.drawing" = "Vias entre met1 e met2."
"met2.drawing" = "Metal 2: fios de sinal (no sky130, preferencialmente na vertical)."
"met2.pin" = "Pinos em metal 2 — muitas vezes os pinos de entrada e saída do chip."
"met2.label" = "Nomes em metal 2."
"via2.drawing" = "Vias entre met2 e met3."
"met3.drawing" = "Metal 3: fios de sinal mais longos (preferencialmente na horizontal)."
"met3.pin" = "Pinos em metal 3."
"met3.label" = "Nomes em metal 3."
"via3.drawing" = "Vias entre met3 e met4."
"met4.drawing" = "Metal 4, grosso: no fluxo de demonstração, as faixas verticais da malha de alimentação."
"met4.pin" = "Pinos em metal 4."
"via4.drawing" = "Vias entre met4 e met5."
"met5.drawing" = "Metal 5, o mais grosso e mais alto: as faixas horizontais da malha de alimentação."
"met5.pin" = "Pinos em metal 5 (VPWR e VGND)."
"met5.label" = "Nomes em metal 5."

[grupos]
# Filtros didáticos: de que passo do fluxo vem cada parte do desenho.
"Células" = ["prBoundary.boundary", "nwell.drawing", "diff.drawing", "tap.drawing", "psdm.drawing", "nsdm.drawing", "poly.drawing", "licon1.drawing", "li1.drawing", "li1.pin", "li1.label", "mcon.drawing"]
"Fios de sinal" = ["met1.drawing", "via.drawing", "met2.drawing", "met2.pin", "via2.drawing", "met3.drawing", "met3.pin"]
"Alimentação" = ["met1.drawing", "via3.drawing", "met4.drawing", "via4.drawing", "met5.drawing", "met5.pin"]

[celulas]
# Família → descrição. O nome real é sky130_fd_sc_hd__<família>_<força>.
dfrtp = "Flip-flop D com reset assíncrono: guarda 1 bit a cada borda de subida do relógio."
dfrtn = "Flip-flop D com reset, sensível à borda de descida."
dfxtp = "Flip-flop D sem reset: guarda 1 bit a cada borda de subida."
dfstp = "Flip-flop D com set assíncrono."
dfbbp = "Flip-flop D com set e reset."
dlxtp = "Latch: transparente enquanto o relógio está alto."
inv = "Inversor: a porta NÃO."
clkinv = "Inversor da árvore de relógio."
buf = "Buffer: repete o sinal com mais força, para fios longos ou muita carga."
clkbuf = "Buffer da árvore de relógio: leva o relógio aos flip-flops com atraso equilibrado."
dlygate = "Célula de atraso, usada para corrigir caminhos rápidos demais (hold)."
nand2 = "Porta NAND de 2 entradas."
nand3 = "Porta NAND de 3 entradas."
nand4 = "Porta NAND de 4 entradas."
nor2 = "Porta NOR de 2 entradas."
nor3 = "Porta NOR de 3 entradas."
nor4 = "Porta NOR de 4 entradas."
and2 = "Porta E (AND) de 2 entradas."
and3 = "Porta E (AND) de 3 entradas."
and4 = "Porta E (AND) de 4 entradas."
or2 = "Porta OU (OR) de 2 entradas."
or3 = "Porta OU (OR) de 3 entradas."
or4 = "Porta OU (OR) de 4 entradas."
xor2 = "Porta OU exclusivo (XOR): 1 quando as entradas são diferentes."
xnor2 = "Porta XNOR: 1 quando as entradas são iguais."
mux2 = "Multiplexador 2:1: escolhe uma de duas entradas."
mux2i = "Multiplexador 2:1 com saída invertida."
ha = "Meio-somador: soma dois bits."
fa = "Somador completo: soma três bits (dois mais o vai-um)."
maj3 = "Maioria de 3: 1 quando pelo menos duas entradas são 1."
conb = "Constante: fornece um 0 e um 1 fixos ao circuito."
tapvpwrvgnd = "Tap: liga o poço e o substrato à alimentação, para os transistores não flutuarem. Espalhada pelo floorplan."
fill = "Preenchimento: ocupa os vãos entre células para manter contínuos os poços e os trilhos de alimentação."
decap = "Capacitor de desacoplamento: estabiliza a alimentação. Também preenche vãos."
diode = "Diodo de proteção contra o efeito antena (carga acumulada nos fios durante a fabricação)."
lpflow = "Célula de baixo consumo (isolamento ou retenção)."

[padroes]
# Variantes com uma entrada invertida (o "b" de "bar"): nand2b, nor2b, and2b, or3b…
"^nand\\d+b$" = "Porta NAND com uma entrada invertida: economiza um inversor."
"^nor\\d+b$" = "Porta NOR com uma entrada invertida: economiza um inversor."
"^and\\d+b$" = "Porta E (AND) com uma entrada invertida."
"^or\\d+b$" = "Porta OU (OR) com uma entrada invertida."
"^xor3$" = "OU exclusivo de 3 entradas."
"^xnor3$" = "XNOR de 3 entradas."
"^einv[pn]$" = "Inversor tri-state: só conduz quando habilitado."
"^ebufn$" = "Buffer tri-state."
"^sdf" = "Flip-flop com entrada de varredura (scan), usado para testar o chip depois de fabricado."
"^clkdlybuf" = "Buffer de atraso da árvore de relógio."
"^probe" = "Célula de sonda para medição."
# Famílias compostas AND-OR-INVERT etc.: a21oi, o21ai, a22o…
"^a\\d+oi$" = "Porta composta AND-OR-INVERT: ANDs, cujas saídas entram num OR, invertido no fim. Faz em uma célula o que custaria três portas."
"^o\\d+ai$" = "Porta composta OR-AND-INVERT: ORs, cujas saídas entram num AND, invertido no fim."
"^a\\d+o$" = "Porta composta AND-OR: ANDs seguidos de um OR."
"^o\\d+a$" = "Porta composta OR-AND: ORs seguidos de um AND."
"^a\\d+bo" = "Porta composta AND-OR com uma entrada invertida."
"^o\\d+bai" = "Porta composta OR-AND-INVERT com uma entrada invertida."

# --- Análise do layout (KLayout na imagem) ------------------------------------------------
# Camadas GDS (camada/datatype) que formam cada estrutura. Quem faz as operações booleanas e a
# extração de conectividade é o KLayout; aqui só se diz quais camadas entram.
[dispositivos]
poco_n = "64/20"     # nwell.drawing
difusao = "65/20"    # diff.drawing
porta = "66/20"      # poly.drawing — onde cruza a difusão, há um transistor
tap = "65/44"        # tap.drawing — contato com o poço/substrato
contato = "66/44"    # licon1.drawing
diodo = "81/23"      # areaid.diode — marcador de diodo do PDK

[conectividade]
# Condutores de baixo para cima, alternando com as vias. "sd" é a difusão menos o poly: fonte e
# dreno ficam separados pela porta.
cadeia = [["sd"], ["66/44"], ["67/20", "67/16"], ["67/44"], ["68/20", "68/16"], ["68/44"], ["69/20", "69/16"], ["69/44"], ["70/20", "70/16"], ["70/44"], ["71/20", "71/16"], ["71/44"], ["72/20", "72/16"]]
porta = ["66/20"]
tap = ["65/44"]
# rótulo → camada que ele nomeia (os nomes dos nós vêm daqui: clk, q[3], VPWR…)
rotulos = { "67/5" = "67/20", "68/5" = "68/20", "69/5" = "69/20", "70/5" = "70/20", "71/5" = "71/20", "72/5" = "72/20" }
# a ponteira procura nesta ordem: o que está mais em cima no desenho primeiro
ordem_sonda = ["72/20", "71/20", "70/20", "69/20", "68/20", "67/20", "66/20", "sd"]

[classes]
# Classes de máscaras geradas automaticamente: nome → prefixos das camadas.
"Poços" = ["nwell", "pwell", "dnwell"]
"Difusão e implantes" = ["diff", "tap", "psdm", "nsdm", "hvtp", "lvtn", "hvi"]
"Poly (portas)" = ["poly", "npc"]
"Contatos" = ["licon1", "mcon"]
"Interligação local (li1)" = ["li1"]
"Metal 1" = ["met1", "via"]
"Metal 2" = ["met2", "via2"]
"Metal 3" = ["met3", "via3"]
"Metal 4 e 5" = ["met4", "via4", "met5"]
"Marcadores" = ["prBoundary", "areaid", "text", "boundary"]
