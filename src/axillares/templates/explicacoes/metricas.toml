# O que cada métrica significa e como ler o valor. Chaves = métricas de Axillares.
[fmax_mhz]
o_que = "A maior frequência de relógio em que o circuito ainda funciona, pelo caminho mais lento entre dois flip-flops."
leitura = "Maior é melhor. Se for menor que a frequência alvo do projeto, o chip não aguenta o relógio pedido."

[folga_setup_ns]
o_que = "Quanto tempo sobra, no pior caminho, entre o sinal chegar ao flip-flop e a próxima borda do relógio."
leitura = "Positiva: cabe no relógio. Negativa: algum caminho é lento demais."

[wns_setup_ns]
o_que = "A pior folga negativa de setup (worst negative slack). Zero quando não há violação."
leitura = "Precisa ser 0."

[tns_setup_ns]
o_que = "A soma de todas as folgas negativas de setup (total negative slack)."
leitura = "Precisa ser 0; quanto mais negativa, mais caminhos violam."

[folga_hold_ns]
o_que = "Folga de hold: se o sinal novo não chega rápido demais e atropela o valor que o flip-flop está capturando."
leitura = "Precisa ser positiva."

[wns_hold_ns]
o_que = "A pior folga negativa de hold."
leitura = "Precisa ser 0."

[area_celulas_um2]
o_que = "A soma da área de todas as células padrão do circuito."
leitura = "Menor é mais barato. Cresce com a lógica que você descreve."

[area_total_um2]
o_que = "A área do chip inteiro: células, espaço para fios, margens e alimentação."
leitura = "É o tamanho do recorte de silício."

[utilizacao_pct]
o_que = "Quanto da área útil do chip as células ocupam."
leitura = "Entre 40 % e 70 % é confortável; muito alta dificulta o roteamento."

[celulas]
o_que = "Quantas células padrão o circuito usa, incluindo as de apoio (preenchimento, tap, buffers)."
leitura = "Compare execuções: dobrar a lógica deve dobrar mais ou menos as células."

[registradores]
o_que = "Quantos flip-flops (bits de memória) existem no circuito."
leitura = "Deve bater com o que você descreveu: um contador de 8 bits tem 8."

[buffers]
o_que = "Células que só repetem o sinal, inseridas para acelerar fios longos ou com muita carga."
leitura = "Algumas são normais; muitas indicam fios longos ou sinais com carga demais."

[inversores]
o_que = "Células que invertem o sinal."
leitura = "Informativo."

[redes]
o_que = "Quantos fios distintos (nets) ligam as células."
leitura = "Informativo; cresce com a complexidade."

[pinos]
o_que = "Quantas ligações o chip tem com o mundo de fora, mais as de alimentação."
leitura = "Bate com as portas do módulo de topo."

[profundidade_logica]
o_que = "Quantas células o sinal atravessa no caminho mais longo entre dois flip-flops."
leitura = "Menor é mais rápido."

[potencia_pico_mw]
o_que = "A potência estimada no pior momento, em miliwatts."
leitura = "Cresce com a frequência e com quantas células chaveiam."

[potencia_fuga_mw]
o_que = "A potência gasta mesmo parado, pela fuga de corrente dos transistores."
leitura = "No sky130 costuma ser minúscula para circuitos pequenos."

[comprimento_fios_um]
o_que = "O comprimento total de todos os fios desenhados no roteamento."
leitura = "Menor é melhor: menos atraso e menos área de metal."

[vias]
o_que = "Quantas ligações verticais entre camadas de metal o roteamento usou."
leitura = "Informativo."

[violacoes_drc]
o_que = "Quantas regras de desenho do PDK o layout desrespeita (largura, espaçamento, sobreposição mínima)."
leitura = "Precisa ser 0 para o chip ser fabricável."

[violacoes_drv]
o_que = "Violações elétricas: transições lentas demais, capacitância ou fan-out acima do permitido."
leitura = "Precisa ser 0."

[erros]
o_que = "Quantos erros as ferramentas relataram ao longo do fluxo."
leitura = "Precisa ser 0."

[avisos]
o_que = "Quantos avisos as ferramentas relataram."
leitura = "Avisos não impedem o chip; leia os do log se algo parecer estranho."

[duracao_fluxo_s]
o_que = "Quanto tempo o motor levou para executar."
leitura = "Informativo."

# --- FPGA (relatório do nextpnr) --------------------------------------------------------------
[fmax_alvo_mhz]
o_que = "A frequência do relógio da placa, que o circuito precisa aguentar."
leitura = "Fixa por placa: 12 MHz no iCEBreaker, 25 MHz na ULX3S."

[folga_fmax_mhz]
o_que = "Quanto a frequência máxima alcançada passa da exigida."
leitura = "Positiva: funciona na placa. Negativa: a temporização falhou."

[fmax_mhz_relogio]
o_que = "A frequência máxima de um domínio de relógio específico."
leitura = "Cada relógio do circuito tem a sua; a pior manda."

[celulas_logicas]
o_que = "Quantas células lógicas (LUTs, e no iCE40 também o flip-flop junto) o circuito ocupa."
leitura = "É o tamanho do circuito na FPGA."

[celulas_logicas_pct]
o_que = "As células lógicas usadas, em porcentagem do que o dispositivo tem."
leitura = "Abaixo de 80 % o roteamento costuma fechar com folga."

[flipflops]
o_que = "Quantos flip-flops (bits de memória) o circuito usa na FPGA."
leitura = "Deve bater com os registradores do seu Verilog."

[flipflops_pct]
o_que = "Os flip-flops usados, em porcentagem do dispositivo."
leitura = "Informativo."

[memorias_bram]
o_que = "Quantos blocos de memória interna (BRAM) o circuito usa."
leitura = "Aparecem quando há vetores de memória grandes no RTL."

[memorias_bram_pct]
o_que = "Os blocos de memória usados, em porcentagem do dispositivo."
leitura = "Informativo."

[dsps]
o_que = "Quantos multiplicadores dedicados (DSP) o circuito usa."
leitura = "Aparecem quando há multiplicação no RTL."

[dsps_pct]
o_que = "Os DSPs usados, em porcentagem do dispositivo."
leitura = "Informativo."

[pinos_fpga]
o_que = "Quantos pinos de entrada e saída da FPGA o circuito usa."
leitura = "Bate com as portas do módulo de topo."

[pinos_fpga_pct]
o_que = "Os pinos usados, em porcentagem dos disponíveis no encapsulamento."
leitura = "Informativo."

[testes_total]
o_que = "Quantos testes automáticos rodaram."
leitura = "Mais testes cobrem mais comportamentos do circuito."

[testes_passaram]
o_que = "Testes cujas asserções foram todas verdadeiras."
leitura = "O ideal é ser igual ao total (menos os pulados)."

[testes_falharam]
o_que = "Testes com alguma asserção falsa — ou que quebraram antes de terminar."
leitura = "Precisa ser 0. Abra o caso para ver o valor encontrado e o esperado."

[testes_pulados]
o_que = "Testes marcados para não rodar (skip)."
leitura = "Não contam como falha, mas também não conferem nada."

[tempo_simulado_ns]
o_que = "Quanto tempo de circuito foi simulado (o relógio da simulação, não o do computador)."
leitura = "Só informativo: diz até onde a onda vai."
